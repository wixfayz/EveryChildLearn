<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EveryChildLearn — Simple & Friendly Learning for Every Child</title>
    <meta
      name="description"
      content="A simple, friendly learning app helping children master alphabets, clear word pronunciation, explanatory video lessons, quizzes, educational games, drawing, and rank rewards."
    />
    <meta property="og:title" content="EveryChildLearn — Simple & Friendly Learning for Every Child" />
    <meta
      property="og:description"
      content="A simple, friendly learning app helping children master alphabets, clear word pronunciation, explanatory video lessons, quizzes, educational games, drawing, and rank rewards."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      #nl-badge-frame,
      #nl-hud-frame,
      iframe[title="Powered by Netlify"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        width: 0 !important;
        height: 0 !important;
        max-width: 0 !important;
        max-height: 0 !important;
      }
    </style>
  </head>
  <body class="bg-[#F4FAFF] text-slate-900 antialiased selection:bg-yellow-200 selection:text-slate-950">
    <div id="nl-badge-frame" aria-hidden="true" style="display:none!important;visibility:hidden!important;"></div>
    <div id="nl-hud-frame" aria-hidden="true" style="display:none!important;visibility:hidden!important;"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (() => {
        const removeBadges = () => {
          document.querySelectorAll('#nl-badge-frame:not([aria-hidden="true"]), #nl-hud-frame:not([aria-hidden="true"]), iframe[title="Powered by Netlify"]').forEach(el => el.remove());
        };
        removeBadges();
        if (typeof MutationObserver !== 'undefined') {
          const obs = new MutationObserver(removeBadges);
          obs.observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
  </body>
</html>
